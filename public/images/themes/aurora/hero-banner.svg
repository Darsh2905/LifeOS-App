<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="50%" stop-color="#1a1a4e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00ff87" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#60efff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0.2" y1="0" x2="0.8" y2="0.6">
      <stop offset="0%" stop-color="#60efff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00ff87" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#60efff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60efff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#sky)"/>
  <ellipse cx="600" cy="120" rx="500" ry="80" fill="url(#aurora1)" filter="url(#glow)"/>
  <ellipse cx="400" cy="160" rx="400" ry="60" fill="url(#aurora2)" filter="url(#glow)"/>
  <ellipse cx="800" cy="100" rx="350" ry="50" fill="url(#aurora1)" filter="url(#glow)" opacity="0.6"/>
  <!-- Stars -->
  <circle cx="100" cy="50" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="250" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="400" cy="60" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="550" cy="20" r="1" fill="white" opacity="0.5"/>
  <circle cx="700" cy="45" r="2" fill="white" opacity="0.9"/>
  <circle cx="850" cy="25" r="1" fill="white" opacity="0.6"/>
  <circle cx="1000" cy="55" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="1100" cy="35" r="1" fill="white" opacity="0.5"/>
  <circle cx="150" cy="80" r="1" fill="white" opacity="0.4"/>
  <circle cx="950" cy="70" r="1.5" fill="white" opacity="0.6"/>
  <!-- Mountains -->
  <polygon points="0,400 200,250 400,400" fill="#0d1117" opacity="0.8"/>
  <polygon points="300,400 550,220 800,400" fill="#0a0e1a" opacity="0.9"/>
  <polygon points="700,400 950,260 1200,400" fill="#0d1117" opacity="0.8"/>
</svg>
