<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a1a4e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff87" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="150" rx="180" ry="100" fill="url(#accent)" filter="url(#glow)"/>
  <circle cx="80" cy="40" r="1" fill="white" opacity="0.6"/>
  <circle cx="320" cy="60" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="200" cy="30" r="1" fill="white" opacity="0.5"/>
  <circle cx="350" cy="250" r="1" fill="white" opacity="0.4"/>
</svg>
