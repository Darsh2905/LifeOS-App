<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a1e"/>
      <stop offset="100%" stop-color="#2d1b3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity="0.6">
    <circle cx="100" cy="80" r="6" fill="#f472b6"/>
    <circle cx="300" cy="120" r="5" fill="#db2777"/>
    <circle cx="200" cy="200" r="7" fill="#f472b6"/>
    <circle cx="350" cy="250" r="4" fill="#db2777"/>
    <ellipse cx="150" cy="180" rx="3" ry="2" fill="#f472b6" transform="rotate(30,150,180)"/>
    <ellipse cx="280" cy="60" rx="3" ry="2" fill="#db2777" transform="rotate(-20,280,60)"/>
  </g>
</svg>
